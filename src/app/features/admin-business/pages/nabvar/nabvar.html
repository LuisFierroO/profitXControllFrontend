<button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú">
    <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
</button>

@if (menuOpen()) {
    <div class="menu-backdrop" (click)="toggleMenu()"></div>
}

<mat-card class="navbar-container" [class.is-open]="menuOpen()">
    <mat-card-content class="navbar-content">
        <div class="logo">
            <img src="logoNoLettersBBg.png" alt="logo" class="logo-img">
        </div>
        <mat-label class="user-name">{{nameUser()}}</mat-label>
        <button matButton="elevated" class="button-navBar" (click)="listBusiness()">Mis negocios</button>
        <button matButton="elevated" class="button-navBar" (click)="createBusiness()">Crear negocio</button>
        <div class="button-logout">
            <button matButton="filled" (click)="exit()">Cerrar sesion</button>
        </div>
    </mat-card-content>
</mat-card>
